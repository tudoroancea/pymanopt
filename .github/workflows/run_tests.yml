name: Run test suite

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - uv

# this is necessary for uv to install dependencies in the system python env and not
# a virtual env (see https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip)
env:
  UV_SYSTEM_PYTHON: 1

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv pip install -e ".[all,ci]"

      - name: Run tests
        run: |
          pytest --cov-report= --cov=src/pymanopt tests/
          coverage lcov -o coverage/lcov.info

      - name: Collect coverage
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.python-version }}
          parallel: true

  finish:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Upload coverage
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
