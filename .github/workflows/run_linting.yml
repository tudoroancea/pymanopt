name: Run linting

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - uv

# this is necessary for uv to install dependencies in the system python env and not
# a virtual env (see https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip)
env:
  UV_SYSTEM_PYTHON: 1

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev,ci]"

      - name: Run linting
        run: |
          isort --check .
          black --check .
          flake8
